# Which implementation backs each interface. Swap a component by changing `impl`.
# Every interface has a `fake` implementation for development and tests.
room_registry:
  impl: json
  options: { path: rooms/studio/manifest.json }
stt:
  impl: fake
  options: { transcript: "go to the sofa" }
llm:
  impl: fake
  options: { reply: "Sure, heading to the sofa now.", tool_call: { name: walk_to, arguments: { location: sofa } } }
tts:
  impl: fake
  options: { sample_rate: 22050 }
viseme_mapper:
  impl: oculus_ipa
chunker:
  impl: punctuation
conversation_store:
  impl: memory
# External tools the LLM can use. Kamari is the user's MCP server with plugins.
tool_providers:
  - impl: kamari_mcp
    enabled: false   # turn on once Kamari is reachable from this backend
    options: { url: "http://localhost:8765/mcp" }
session:
  resume_ttl_s: 600
