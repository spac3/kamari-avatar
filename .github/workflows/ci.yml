name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  speech:
    name: piper speech
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,piper]"
      - uses: actions/cache@v4
        with: { path: server/voices, key: piper-en_US-ljspeech-medium }
      - run: test -f voices/en_US-ljspeech-medium.onnx || python -m piper.download_voices en_US-ljspeech-medium --data-dir voices
      - run: pytest -q tests/test_piper.py
        env: { KAMARI_TEST_PIPER_VOICE: voices/en_US-ljspeech-medium.onnx }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  protocol:
    name: protocol types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install datamodel-code-generator==0.83.0 black==26.5.1 isort==8.0.1
      - run: cd web && npm ci
      - run: python scripts/build_schema.py && git diff --exit-code schema/
      - run: scripts/gen-types.sh --check
