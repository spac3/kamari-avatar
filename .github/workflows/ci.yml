name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  speech:
    name: piper speech and whisper
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,piper,stt]"
      - uses: actions/cache@v4
        with: { path: server/voices, key: piper-en_US-ljspeech-medium }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-tiny.en }
      - run: test -f voices/en_US-ljspeech-medium.onnx || python -m piper.download_voices en_US-ljspeech-medium --data-dir voices
      - run: pytest -q tests/test_piper.py tests/test_whisper.py
        env:
          KAMARI_TEST_PIPER_VOICE: voices/en_US-ljspeech-medium.onnx
          KAMARI_TEST_WHISPER_MODEL: tiny.en

  local-llm:
    name: conversation on a local model (ollama)
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:0.40.3
        ports: ["11434:11434"]
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: pull the model named in config/llm-ollama.yaml
        run: |
          model=$(python -c "from kamari_avatar.config import BackendConfig as C; print(C.load('config/llm-ollama.yaml').llm.options['model'])")
          curl -sf http://localhost:11434/api/pull -d "{\"model\": \"$model\", \"stream\": false}"
      - name: show what the model streams back (diagnostics)
        run: |
          tools='[{"type":"function","function":{"name":"walk_to","description":"Walk to a place","parameters":{"type":"object","properties":{"location":{"type":"string","enum":["sofa","window"]}},"required":["location"]}}}]'
          for stream in false true; do
            curl -s http://localhost:11434/v1/chat/completions -H 'content-type: application/json' -d "{\"model\":\"qwen2.5:1.5b\",\"stream\":$stream,\"max_tokens\":200,\"messages\":[{\"role\":\"user\",\"content\":\"Please walk over to the window.\"}],\"tools\":$tools}" | head -c 3000; echo
          done
      - run: pytest -q -s tests/test_local_llm.py
        env: { KAMARI_TEST_OLLAMA: "1" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  protocol:
    name: protocol types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install datamodel-code-generator==0.83.0 black==26.5.1 isort==8.0.1
      - run: cd web && npm ci
      - run: python scripts/build_schema.py && git diff --exit-code schema/
      - run: scripts/gen-types.sh --check
